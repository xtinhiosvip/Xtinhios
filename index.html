<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Anime Rail Runner 3D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111d;font-family:Arial,sans-serif}
#game{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none}

/* Bầu trời */
.sky{
 position:absolute;inset:0 0 45%;
 background:linear-gradient(#54c9ff 0%,#b9ecff 65%,#dff8ff 100%);
}
.sun{
 position:absolute;width:90px;height:90px;border-radius:50%;
 background:#fff6a0;box-shadow:0 0 45px #fff;
 top:9%;right:13%;
}

/* Núi */
.mountains{
 position:absolute;left:-10%;right:-10%;bottom:39%;
 height:28%;
 background:
 linear-gradient(135deg,transparent 49%,#668b9b 50% 62%,transparent 63%),
 linear-gradient(45deg,transparent 49%,#7ca1ad 50% 63%,transparent 64%);
 background-size:45% 100%,50% 100%;
 opacity:.75;
}

/* Mặt đất */
.ground{
 position:absolute;inset:50% 0 0;
 background:linear-gradient(90deg,#153d31,#1d5639 50%,#153d31);
}

/* Đường ray phối cảnh */
.track{
 position:absolute;
 left:50%;top:44%;
 width:80%;height:70%;
 transform:translateX(-50%);
 background:linear-gradient(90deg,#27303a,#59636b 50%,#27303a);
 clip-path:polygon(43% 0,57% 0,100% 100%,0 100%);
}
.rail{
 position:absolute;bottom:-2%;width:7px;height:73%;
 background:#dfe8ed;
 box-shadow:0 0 5px #222;
}
.rail.l{left:28%;transform:skewX(-7deg)}
.rail.m{left:50%;transform:translateX(-50%)}
.rail.r{right:28%;transform:skewX(7deg)}

.sleepers{
 position:absolute;inset:48% 0 0;
 overflow:hidden;
}
.sleeper{
 position:absolute;left:50%;
 width:55%;height:8px;
 background:#392d28;
 transform:translateX(-50%);
 animation:moveRail .65s linear infinite;
}
@keyframes moveRail{
 from{top:-20px;opacity:.2}
 to{top:100% ;opacity:1}
}

/* Tàu */
.train{
 position:absolute;
 width:95px;height:48px;
 background:linear-gradient(#e43e42,#8e141b);
 border:3px solid #571015;
 border-radius:8px;
 top:49%;
 left:50%;
 transform:translate(-50%,-50%);
 box-shadow:0 8px 15px #0007;
}
.train:before,.train:after{
 content:"";position:absolute;bottom:-15px;
 width:18px;height:18px;border-radius:50%;
 background:#111;border:4px solid #777;
}
.train:before{left:10px}.train:after{right:10px}
.train span{
 position:absolute;left:10px;right:10px;top:8px;height:15px;
 background:#9de5ff;border:2px solid #274d5e;
}

/* Chướng ngại vật */
.obstacle{
 position:absolute;
 width:55px;height:55px;
 background:linear-gradient(135deg,#ffcf32,#d87900);
 border:4px solid #743800;
 border-radius:10px;
 box-shadow:0 8px 12px #0008;
 z-index:8;
}
.obstacle:after{
 content:"⚠";font-size:27px;color:#7b2600;
 position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
}

/* Nhân vật anime */
.player{
 position:absolute;
 width:65px;height:105px;
 left:50%;bottom:11%;
 transform:translateX(-50%);
 z-index:20;
 transition:left .15s ease;
}
.head{
 position:absolute;top:0;left:17px;
 width:32px;height:32px;border-radius:50%;
 background:#ffd1ad;border:2px solid #542d2d;
}
.hair{
 position:absolute;top:-5px;left:12px;width:42px;height:25px;
 background:#29245f;
 clip-path:polygon(0 70%,15% 0,35% 35%,52% 0,70% 35%,100% 10%,87% 90%,20% 100%);
 z-index:2;
}
.body{
 position:absolute;top:30px;left:12px;width:41px;height:48px;
 background:linear-gradient(90deg,#1b4dbe,#54a8ff);
 border:2px solid #162b61;border-radius:12px 12px 7px 7px;
}
.arm,.leg{
 position:absolute;background:#ffd1ad;border:2px solid #542d2d;
 border-radius:12px;transform-origin:top center;
}
.arm{width:11px;height:42px;top:34px}
.arm.a{left:4px;animation:arm1 .28s infinite alternate}
.arm.b{right:3px;animation:arm2 .28s infinite alternate}
.leg{width:13px;height:40px;top:72px;background:#20294d}
.leg.a{left:14px;animation:leg1 .28s infinite alternate}
.leg.b{right:12px;animation:leg2 .28s infinite alternate}

@keyframes arm1{to{transform:rotate(42deg)}}
@keyframes arm2{to{transform:rotate(-42deg)}}
@keyframes leg1{to{transform:rotate(-35deg)}}
@keyframes leg2{to{transform:rotate(35deg)}}

/* Người đuổi */
.chaser{
 position:absolute;z-index:14;
 left:50%;bottom:-5%;
 transform:translateX(-50%) scale(.75);
 opacity:0;
 transition:opacity .5s;
}
.chaser.active{opacity:1}
.chaser .body{background:#8d2434}

/* HUD */
#hud{
 position:absolute;top:15px;left:15px;right:15px;
 display:flex;justify-content:space-between;
 color:white;font-weight:bold;z-index:50;
 text-shadow:0 2px 4px #000;
}
.box{
 background:#0008;border:1px solid #ffffff55;
 padding:9px 14px;border-radius:12px;
 backdrop-filter:blur(5px);
}

/* Màn hình bắt đầu */
#start{
 position:absolute;inset:0;z-index:100;
 display:flex;align-items:center;justify-content:center;
 flex-direction:column;text-align:center;
 background:linear-gradient(#06132199,#02070dcc);
 color:white;
}
#start h1{
 font-size:32px;margin:0 0 8px;
 text-shadow:0 0 15px #38cfff;
}
#start p{opacity:.85}
button{
 border:0;border-radius:18px;padding:15px 30px;
 font-size:18px;font-weight:bold;color:white;
 background:linear-gradient(135deg,#00aaff,#6c43ff);
 box-shadow:0 7px 20px #008cff66;
}
#hint{
 position:absolute;bottom:25px;left:50%;
 transform:translateX(-50%);
 color:white;z-index:60;background:#0008;
 padding:9px 15px;border-radius:15px;
 white-space:nowrap;
}
</style>
</head>

<body>
<div id="game">

<div class="sky"></div>
<div class="sun"></div>
<div class="mountains"></div>
<div class="ground"></div>

<div class="track">
  <div class="rail l"></div>
  <div class="rail m"></div>
  <div class="rail r"></div>
</div>

<div class="sleepers" id="sleepers"></div>

<div class="train"><span></span></div>

<div id="obstacles"></div>

<div class="player" id="player">
  <div class="hair"></div>
  <div class="head"></div>
  <div class="body"></div>
  <div class="arm a"></div>
  <div class="arm b"></div>
  <div class="leg a"></div>
  <div class="leg b"></div>
</div>

<div class="player chaser" id="chaser">
  <div class="hair"></div>
  <div class="head"></div>
  <div class="body"></div>
  <div class="arm a"></div>
  <div class="arm b"></div>
  <div class="leg a"></div>
  <div class="leg b"></div>
</div>

<div id="hud">
 <div class="box">⭐ Điểm: <span id="score">0</span></div>
 <div class="box">🏃 Tốc độ: <span id="speed">1</span></div>
</div>

<div id="hint">← Vuốt trái / phải → để đổi đường</div>

<div id="start">
 <h1>🚆 ANIME RAIL RUNNER</h1>
 <p>Chạm màn hình để bắt đầu</p>
 <button id="startBtn">▶ TIẾP TỤC</button>
</div>

</div>

<script>
const game=document.getElementById("game");
const player=document.getElementById("player");
const chaser=document.getElementById("chaser");
const obstacles=document.getElementById("obstacles");
const sleepers=document.getElementById("sleepers");
const scoreEl=document.getElementById("score");
const speedEl=document.getElementById("speed");
const start=document.getElementById("start");

let lane=1;
let running=false;
let score=0;
let speed=5;
let lastSpawn=0;
let touchX=0;
let animation;

const lanes=[28,50,72];

function setLane(){
 player.style.left=lanes[lane]+"%";
}

function createSleepers(){
 for(let i=0;i<14;i++){
   const s=document.createElement("div");
   s.className="sleeper";
   s.style.animationDelay=(i*.045)+"s";
   sleepers.appendChild(s);
 }
}

function spawnObstacle(){
 const o=document.createElement("div");
 o.className="obstacle";
 const l=Math.floor(Math.random()*3);
 o.dataset.lane=l;
 o.style.left=lanes[l]+"%";
 o.style.top="-70px";
 o.style.transform="translateX(-50%)";
 obstacles.appendChild(o);
}

function startGame(){
 running=true;
 score=0;
 speed=5;
 scoreEl.textContent=0;
 speedEl.textContent=1;
 start.style.display="none";
 chaser.classList.add("active");
 setLane();

 document.querySelectorAll(".obstacle").forEach(x=>x.remove());

 lastSpawn=performance.now();
 animation=requestAnimationFrame(loop);
}

function gameOver(){
 running=false;
 cancelAnimationFrame(animation);

 start.style.display="flex";
 start.innerHTML=`
 <h1>💥 GAME OVER</h1>
 <p>Điểm của bạn: ${score}</p>
 <button id="restart">🔄 CHƠI LẠI</button>
 `;
 document.getElementById("restart").onclick=startGame;
}

function moveObstacles(){
 document.querySelectorAll(".obstacle").forEach(o=>{
   let y=parseFloat(o.style.top);
   y+=speed;
   o.style.top=y+"px";

   if(y>innerHeight+80){
     o.remove();
     score++;
     scoreEl.textContent=score;

     if(score%10===0){
       speed+=.5;
       speedEl.textContent=(speed/5).toFixed(1);
     }
   }

   const pr=player.getBoundingClientRect();
   const r=o.getBoundingClientRect();

   if(
     r.left<pr.right &&
     r.right>pr.left &&
     r.top<pr.bottom &&
     r.bottom>pr.top
   ){
     gameOver();
   }
 });
}

function loop(time){
 if(!running)return;

 if(time-lastSpawn>900){
   spawnObstacle();
   lastSpawn=time;
 }

 moveObstacles();
 animation=requestAnimationFrame(loop);
}

function moveLeft(){
 if(!running)return;
 lane=Math.max(0,lane-1);
 setLane();
}

function moveRight(){
 if(!running)return;
 lane=Math.min(2,lane+1);
 setLane();
}

game.addEventListener("touchstart",e=>{
 touchX=e.touches[0].clientX;
});

game.addEventListener("touchend",e=>{
 if(!running)return;
 const x=e.changedTouches[0].clientX;
 const dx=x-touchX;

 if(Math.abs(dx)>40){
   if(dx<0)moveLeft();
   else moveRight();
 }
});

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")moveLeft();
 if(e.key==="ArrowRight"||e.key==="d")moveRight();
});

document.getElementById("startBtn").onclick=startGame;

createSleepers();
setLane();
</script>

</body>
</html>
